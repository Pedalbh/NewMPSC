{% extends "base.html" %}
{% block titulo %}Seus dados · NewMPSC{% endblock %}
{% block classe_main %}estreito{% endblock %}
{% block conteudo %}
<section class="saudacao"><h1>Seus dados</h1><p class="fraco">Aparecem no fecho das peças e na sua mesa.</p></section>
<section class="cartao">
  <form method="post" action="/configuracoes" class="pilha">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label class="campo">Nome <input type="text" name="nome" value="{{ usuario.nome }}" required maxlength="120" autocomplete="name"></label>
    <label class="campo">Cargo <input type="text" name="cargo" value="{{ usuario.cargo }}" maxlength="120"></label>
    <label class="campo">Promotoria <input type="text" name="promotoria" value="{{ usuario.promotoria }}" maxlength="160"></label>
    <label class="campo">E-mail de acesso <input type="email" value="{{ usuario.email }}" disabled></label>
    <button class="btn principal" type="submit">Salvar</button>
  </form>
</section>
{% endblock %}
